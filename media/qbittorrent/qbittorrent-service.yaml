apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: default
spec:
  selector:
    app: qbittorrent
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
  - name: torrenttcp
    protocol: TCP
    port: 6881
    targetPort: 6881
  - name: torrentudp
    protocol: UDP
    port: 6881
    targetPort: 6881
  type: NodePort
