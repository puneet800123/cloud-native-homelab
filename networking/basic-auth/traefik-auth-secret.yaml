# Traefik basic-auth Secret used by the 'basic-auth' Middleware.
# The 'auth' key is an htpasswd entry (user:hashedpassword), base64-encoded.
# Generate a real value:
#   htpasswd -nb <user> <password> | base64 -w0
# then replace CHANGE_ME below.
apiVersion: v1
kind: Secret
metadata:
  name: traefik-auth-secret
  namespace: default
type: Opaque
data:
  auth: CHANGE_ME
