apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  labels:
    app: homeassistant
spec:
  replicas: 1
  # Recreate is recommended for Home Assistant to prevent multiple pods from locking the config file
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      # Maps to --network=host
      hostNetwork: true
      containers:
      - name: homeassistant
        image: ghcr.io/home-assistant/home-assistant:stable
        securityContext:
          privileged: true
        envFrom:
        - configMapRef:
            name: homeassistant-config
        volumeMounts:
        - name: config
          mountPath: /config
        - name: dbus
          mountPath: /run/dbus
          readOnly: true
      volumes:
      # Maps to -v /PATH_TO_YOUR_CONFIG:/config
      - name: config
        hostPath:
          path: /mnt/config/homeassistant
          type: DirectoryOrCreate
      # Maps to -v /run/dbus:/run/dbus:ro
      - name: dbus
        hostPath:
          path: /run/dbus
          type: Directory
