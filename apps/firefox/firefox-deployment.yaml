apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefox
  labels:
    app: firefox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firefox
  template:
    metadata:
      labels:
        app: firefox
    spec:
      containers:
        - name: firefox
          image: lscr.io/linuxserver/firefox:latest
          ports:
            - containerPort: 3000
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: firefox-config
          volumeMounts:
            - name: config-volume
              mountPath: /config
            - name: tmp-volume
              mountPath: /tmp
          resources:
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: config-volume
          hostPath:
            path: /mnt/config/firefox/config
            type: DirectoryOrCreate
        - name: tmp-volume
          hostPath:
            path: /mnt/tmp/firefox
            type: DirectoryOrCreate
      restartPolicy: Always
