apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactive-resume
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reactive-resume
  template:
    metadata:
      labels:
        app: reactive-resume
    spec:
      containers:
        - name: reactive-resume
          image: amruthpillai/reactive-resume:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: reactive-resume-config
            - secretRef:
                name: reactive-resume-secret
