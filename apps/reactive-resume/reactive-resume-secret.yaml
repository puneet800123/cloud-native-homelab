apiVersion: v1
kind: Secret
metadata:
  name: reactive-resume-secret
  labels:
    app: reactive-resume
type: Opaque
stringData:
  # CHANGE_ME: full Postgres connection string, e.g.
  # postgresql://postgres:<password>@postgres:5432/reactive_resume
  DATABASE_URL: CHANGE_ME
  # CHANGE_ME: random secrets (openssl rand -hex 32)
  JWT_SECRET: CHANGE_ME
  ACCESS_TOKEN_SECRET: CHANGE_ME
  REFRESH_TOKEN_SECRET: CHANGE_ME
  CHROME_TOKEN: CHANGE_ME
  # CHANGE_ME: must match MinIO root credentials (databases/minio/minio-secret.yaml)
  STORAGE_ACCESS_KEY: CHANGE_ME
  STORAGE_SECRET_KEY: CHANGE_ME
