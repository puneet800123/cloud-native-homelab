apiVersion: v1
kind: Secret
metadata:
  name: n8n-secret
  namespace: default
  labels:
    app: n8n
type: Opaque
stringData:
  # CHANGE_ME: must match the Postgres password (databases/postgres/postgres-secret.yaml)
  DB_POSTGRESDB_PASSWORD: CHANGE_ME
  # CHANGE_ME: n8n basic-auth login credentials
  N8N_BASIC_AUTH_USER: CHANGE_ME
  N8N_BASIC_AUTH_PASSWORD: CHANGE_ME
