# Kubernetes-managed ServiceAccount token. No credential material is stored
# here in source — the token value is populated by the cluster at apply time.
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: homepage
  namespace: default
  labels:
    app.kubernetes.io/name: homepage
  annotations:
    kubernetes.io/service-account.name: homepage
