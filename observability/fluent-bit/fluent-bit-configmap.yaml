apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: default
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Daemon       Off
        Log_Level    info

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Parser            docker
        Tag               kube.*
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   Off
        Refresh_Interval  10

    [FILTER]
        Name              kubernetes
        Match             kube.*
        Merge_Log         On
        Keep_Log          Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude Off

    [FILTER]
        Name                  grep
        Match                 kube.*
        Exclude               kubernetes['container_name'] victoria-logs|fluent-bit

    [OUTPUT]
        Name              http
        Match             kube.*
        Host              victorialogs
        Port              9428
        URI               /insert/jsonline?_stream_fields=kubernetes.container_name&_msg_field=log&_time_field=date
        Format            json_lines
        json_date_key     timestamp
        json_date_format  iso8601
