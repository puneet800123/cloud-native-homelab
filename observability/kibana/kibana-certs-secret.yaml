# Placeholder TLS Secret for Kibana.
# Generate real certs (see observability/README.md) and recreate this Secret:
#   kubectl create secret generic kibana-certs \
#     --from-file=ca.crt --from-file=tls.crt --from-file=tls.key
apiVersion: v1
kind: Secret
metadata:
  name: kibana-certs
  namespace: default
  labels:
    app: kibana
type: Opaque
stringData:
  ca.crt: CHANGE_ME
  tls.crt: CHANGE_ME
  tls.key: CHANGE_ME
