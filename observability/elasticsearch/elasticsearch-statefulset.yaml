apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: default
  labels:
    app: elasticsearch
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /usr/share/elasticsearch/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
        - name: increase-vm-max-map
          image: busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
        - name: prepare-config
          image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
          command:
            - sh
            - -c
            - |
              set -e
              cp -r /usr/share/elasticsearch/config/* /tmp/config/
              cp /tmp/configmap/elasticsearch.yml /tmp/config/elasticsearch.yml
              mkdir -p /tmp/config/certs
              cp /tmp/secret/* /tmp/config/certs/
              chown -R 1000:1000 /tmp/config
              chmod 600 /tmp/config/certs/tls.key
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: configmap
              mountPath: /tmp/configmap
            - name: secret
              mountPath: /tmp/secret
            - name: config
              mountPath: /tmp/config
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          ports:
            - name: https
              containerPort: 9200
            - name: transport
              containerPort: 9300
          envFrom:
            - configMapRef:
                name: elasticsearch-env
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
            - name: config
              mountPath: /usr/share/elasticsearch/config
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  curl -sk
                  --cacert /usr/share/elasticsearch/config/certs/ca.crt
                  -u "elastic:${ELASTIC_PASSWORD}"
                  https://localhost:9200/_cluster/health
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: configmap
          configMap:
            name: elasticsearch-config
        - name: secret
          secret:
            secretName: elastic-certs
        - name: config
          emptyDir: {}
        - name: data
          hostPath:
            path: /mnt/data/elasticsearch
            type: DirectoryOrCreate
