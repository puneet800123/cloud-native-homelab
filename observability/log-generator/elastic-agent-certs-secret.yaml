# Placeholder TLS Secret used by the demo Elastic Agent to trust Fleet Server.
# Generate real certs (see observability/README.md) and recreate this Secret:
#   kubectl create secret generic elastic-agent-certs --from-file=ca.crt
apiVersion: v1
kind: Secret
metadata:
  name: elastic-agent-certs
  namespace: default
  labels:
    app: log-generator
type: Opaque
stringData:
  ca.crt: CHANGE_ME
