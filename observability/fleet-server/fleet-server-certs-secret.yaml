# Placeholder TLS Secret for Fleet Server (agents enroll over this cert).
# Generate real certs (see observability/README.md) and recreate this Secret:
#   kubectl create secret generic fleet-server-certs \
#     --from-file=ca.crt --from-file=tls.crt --from-file=tls.key
apiVersion: v1
kind: Secret
metadata:
  name: fleet-server-certs
  namespace: default
  labels:
    app: fleet-server
type: Opaque
stringData:
  ca.crt: CHANGE_ME
  tls.crt: CHANGE_ME
  tls.key: CHANGE_ME
