apiVersion: v1
kind: Secret
metadata:
  name: fleet-server-secret
  namespace: default
  labels:
    app: fleet-server
type: Opaque
stringData:
  # CHANGE_ME: Fleet Server service token.
  # Create it in Kibana → Fleet → Settings, or via the ES API, then paste here.
  FLEET_SERVER_SERVICE_TOKEN: CHANGE_ME
