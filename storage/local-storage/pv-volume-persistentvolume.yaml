apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-volume
  labels:
    type: local
spec:
  storageClassName: local-storage
  claimRef:
    name: pv-claim
    namespace: default
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  local:
    path: /apps
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          # CHANGE_ME: set to your node's hostname (kubectl get nodes)
          - "photon-os"
